<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Nav Test</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; }
        .tab-content { display: none; padding: 20px; background: #f0f0f0; margin: 10px 0; }
        .tab-content.active { display: block; }
        .mobile-menu { position: fixed; bottom: 0; left: 0; right: 0; background: #333; padding: 10px; display: flex; justify-content: space-around; }
        .mobile-menu-item { color: white; padding: 10px; cursor: pointer; }
        .mobile-menu-item.active { background: #666; }
        #debug { position: fixed; top: 10px; right: 10px; background: yellow; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Mobile Navigation Test</h1>
    <div id="debug">Debug info will appear here</div>
    
    <div id="tab1" class="tab-content active">
        <h2>Tab 1: Overview</h2>
        <p>This is the overview tab</p>
    </div>
    
    <div id="tab2" class="tab-content">
        <h2>Tab 2: Projects</h2>
        <p>This is the projects tab</p>
    </div>
    
    <div id="tab3" class="tab-content">
        <h2>Tab 3: Skills</h2>
        <p>This is the skills tab</p>
    </div>
    
    <nav class="mobile-menu">
        <div class="mobile-menu-item active" onclick="switchTab('tab1', this)">Overview</div>
        <div class="mobile-menu-item" onclick="switchTab('tab2', this)">Projects</div>
        <div class="mobile-menu-item" onclick="switchTab('tab3', this)">Skills</div>
    </nav>
    
    <script>
        function switchTab(tabName, element) {
            document.getElementById('debug').textContent = 'Clicked: ' + tabName;
            
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active from all menu items
            document.querySelectorAll('.mobile-menu-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Show selected tab
            const tab = document.getElementById(tabName);
            if (tab) {
                tab.classList.add('active');
                document.getElementById('debug').textContent += ' - Tab found!';
            } else {
                document.getElementById('debug').textContent += ' - Tab NOT found!';
                return;
            }
            
            // Update active state
            if (element) {
                element.classList.add('active');
                document.getElementById('debug').textContent += ' - Menu updated!';
            }
        }
        
        // Test on load
        document.getElementById('debug').textContent = 'Page loaded. Click a tab.';
    </script>
</body>
</html>
