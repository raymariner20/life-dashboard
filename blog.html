<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - AI Being Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fafafa;
            line-height: 1.6;
        }
        
        .header {
            background: linear-gradient(135deg, #f97316, #f59e0b);
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .header p { opacity: 0.9; }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }
        
        /* Blog List Styles */
        .blog-list-header {
            margin-bottom: 30px;
        }
        .blog-list-header h2 {
            color: #f97316;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .blog-list-header p {
            color: #a3a3a3;
        }
        
        .blog-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .blog-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.15);
        }
        .blog-card-image {
            font-size: 4rem;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(245, 158, 11, 0.1));
        }
        .blog-card-content {
            padding: 20px;
        }
        .blog-card-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .blog-category {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .blog-date {
            color: #6b7280;
            font-size: 0.85rem;
        }
        .blog-card-title {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #fafafa;
            line-height: 1.4;
        }
        .blog-card-excerpt {
            color: #a3a3a3;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .blog-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .blog-read-time {
            color: #6b7280;
            font-size: 0.85rem;
        }
        .blog-read-more {
            color: #f97316;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        /* Blog Post Styles */
        .blog-post {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .blog-back {
            display: inline-block;
            color: #f97316;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .blog-back:hover {
            text-decoration: underline;
        }
        
        .blog-post-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .blog-post-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .blog-post-title {
            font-size: 1.8rem;
            color: #fafafa;
            line-height: 1.3;
        }
        
        .blog-post-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #e5e5e5;
        }
        .blog-post-content h2 {
            color: #f97316;
            font-size: 1.4rem;
            margin: 35px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .blog-post-content p {
            margin-bottom: 18px;
        }
        .blog-post-content ul {
            margin: 15px 0 20px 25px;
        }
        .blog-post-content li {
            margin-bottom: 10px;
        }
        .blog-intro {
            font-size: 1.15rem;
            color: #d4d4d4;
            border-left: 3px solid #f97316;
            padding-left: 20px;
            margin: 20px 0 25px 0;
        }
        .blog-highlight {
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin: 25px 0;
            color: #fafafa;
        }
        .blog-highlight strong {
            color: #f97316;
        }
        
        .blog-post-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #141414;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #a3a3a3;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 5px 10px;
            text-align: center;
            text-decoration: none;
        }
        .nav-btn.active { color: #f97316; }
        .nav-btn .icon { font-size: 1.3rem; display: block; margin-bottom: 3px; }
        
        @media (max-width: 600px) {
            .blog-post-title {
                font-size: 1.4rem;
            }
            .blog-post-content {
                font-size: 1rem;
            }
            .blog-card-image {
                font-size: 3rem;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 AI Being Labs Blog</h1>
        <p>Research, Insights & Industry Analysis</p>
    </div>
    
    <div class="container">
        <!-- Blog List View -->
        <div id="blog-list-container">
            <div class="blog-list-header">
                <h2>Latest Articles</h2>
                <p>Deep dives into cloud computing, SaaS trends, and emerging technologies</p>
            </div>
            <!-- Blog cards will be inserted here by JavaScript -->
        </div>
        
        <!-- Single Blog Post View -->
        <div id="blog-post-container" style="display: none;">
            <!-- Blog post content will be inserted here by JavaScript -->
        </div>
    </div>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-btn">
            <span class="icon">🏠</span>
            Dashboard
        </a>
        <a href="blog.html" class="nav-btn active">
            <span class="icon">📝</span>
            Blog
        </a>
    </div>
    
    <script src="blog-data.js"></script>
</body>
</html>
